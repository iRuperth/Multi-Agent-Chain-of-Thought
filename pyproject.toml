[project]
name = "offerly"
version = "0.1.0"
description = "Multi-agent campaign onboarding system (CrewAI + Ollama)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai[litellm]>=0.86.0",
    "crewai-tools>=0.17.0",
    "pydantic>=2.7",
    "langchain-ollama>=0.2.0",
    "rich>=13.7",
    "fastapi[standard]>=0.115.0",
]

[project.scripts]
offerly = "offerly.cli:main"
offerly-web = "offerly.web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offerly"]
